name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        # --legacy-peer-deps: el proyecto tiene un desajuste preexistente entre
        # @capacitor/android (8.4) y @capacitor/core (8.3.4).
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm run test.unit -- --run
      - name: Build
        run: npm run build
